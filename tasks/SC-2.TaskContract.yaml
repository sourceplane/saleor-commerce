apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: SC-2
  title: "The storefront on Workers"
spec:
  goal: Saleor's Next.js storefront runs as one Cloudflare Worker with Static Assets, its Saleor reads cached in R2 and revalidated through the Durable Object tag cache, live before a store is connected
  affects:
    - apps/web
    - infra/terraform/cloudflare-r2
    - tests/web
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - README.md
  doneWhen:
    - pnpm typecheck, lint, test and build are green with no Saleor store
    - wrangler dev serves the unconnected storefront without a 500, and a connected one from cached reads revalidated by Saleor's signed webhook
  gates: []
