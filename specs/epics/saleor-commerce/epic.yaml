# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (SC → SC-1, SC-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: saleor-commerce
  key: SC
spec:
  title: "Saleor's Next.js storefront on Cloudflare Workers"
  summary: "Saleor's Next.js storefront (Paper, Vercel's Next.js Saleor Commerce) — home, categories, collections, search, product pages, a cart, a multi-step checkout, accounts and orders, every Saleor read a \"use cache\" entry revalidated by Saleor's webhook — runs as one Cloudflare Worker with Static Assets, its data cache in R2 and its tag cache and revalidation queue in Durable Objects, live before a Saleor store is connected, and becomes an Orun baseline that takes a new storefront from nothing to live on stage and prod in one landing."
  state: started
  milestones:
    - name: "SC0 — the spec"
      exitCriteria:
        - "the repository is born with its intent, CI, tooling and spec index, and this doc set and the task contracts are on main"
      tasks: [SC-1]
    - name: "SC1 — the storefront on Workers"
      exitCriteria:
        - "apps/web is upstream's storefront built by OpenNext into one Worker with Static Assets, the R2 incremental cache, the Durable Object tag cache and queue, Cache Components off and every \"use cache\" read kept"
        - "the GraphQL types, codegen and lint read Saleor's published schema; typecheck, lint, test (upstream's suite and tests/web) and build are green with no store"
        - "with no store connected the storefront says \"Connect your Saleor store\" and sends every page there, never a 500; connected, wrangler dev serves the catalogue, reuses the cache and revalidates on Saleor's signed webhook"
      tasks: [SC-2]
    - name: "SC2 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new storefront from nothing to live on stage and prod in one landing, then record it"
        - "a storefront built from it carries the product only, renamed throughout to its own name, repository, Worker and buckets, with Saleor's licence intact"
        - "Baseline CI is green: contract tests, the wiring path, generated component docs, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier — the stage lane's steps in a staged tree, served as born, then connected to a stand-in Saleor and browsed"
      tasks: [SC-3]
